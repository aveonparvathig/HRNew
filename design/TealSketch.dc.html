<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; }
    a { color: #0E9384; } a:hover { color: #0B7568; }
  </style>
</helmet>
<div style="width: 760px; height: 540px; background: #F6FAF9; color: #1B2437; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; font-size: 13px; box-sizing: border-box;">
  <div style="padding: 12px 18px; background: #FFFFFF; border-bottom: 1.5px dashed #C9D6D3; display: flex; align-items: center; gap: 10px;">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #0E9384;">Alternate direction &#8212; low-fi</span>
    <span style="font-size: 12px; font-weight: 600; color: #667085;">same system, teal accent on a green-tinted white</span>
  </div>
  <div style="flex: 1; display: flex;">
    <div style="width: 150px; background: #FFFFFF; border-right: 1.5px dashed #C9D6D3; padding: 14px 10px; display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 26px; border-radius: 7px; background: #0E9384; opacity: 0.9;"></div>
      <div style="height: 18px; border-radius: 6px; background: color-mix(in srgb, #0E9384 12%, white);"></div>
      <div style="height: 18px; border-radius: 6px; background: #EDF1F0;"></div>
      <div style="height: 18px; border-radius: 6px; background: #EDF1F0;"></div>
      <div style="height: 18px; border-radius: 6px; background: #EDF1F0;"></div>
      <div style="height: 18px; border-radius: 6px; background: #EDF1F0;"></div>
      <div style="height: 18px; border-radius: 6px; background: #EDF1F0;"></div>
    </div>
    <div style="flex: 1; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;">
        <div style="height: 58px; background: #FFFFFF; border: 1.5px dashed #C9D6D3; border-radius: 10px; padding: 8px 10px;"><div style="width: 60%; height: 8px; background: #E3EAE8; border-radius: 4px; margin-bottom: 8px;"></div><div style="width: 40%; height: 12px; background: #0E9384; border-radius: 4px; opacity: 0.85;"></div></div>
        <div style="height: 58px; background: #FFFFFF; border: 1.5px dashed #C9D6D3; border-radius: 10px; padding: 8px 10px;"><div style="width: 60%; height: 8px; background: #E3EAE8; border-radius: 4px; margin-bottom: 8px;"></div><div style="width: 40%; height: 12px; background: #129D61; border-radius: 4px;"></div></div>
        <div style="height: 58px; background: #FFFFFF; border: 1.5px dashed #C9D6D3; border-radius: 10px; padding: 8px 10px;"><div style="width: 60%; height: 8px; background: #E3EAE8; border-radius: 4px; margin-bottom: 8px;"></div><div style="width: 40%; height: 12px; background: #DE8F0D; border-radius: 4px;"></div></div>
        <div style="height: 58px; background: #FFFFFF; border: 1.5px dashed #C9D6D3; border-radius: 10px; padding: 8px 10px;"><div style="width: 60%; height: 8px; background: #E3EAE8; border-radius: 4px; margin-bottom: 8px;"></div><div style="width: 40%; height: 12px; background: #98A2B3; border-radius: 4px;"></div></div>
      </div>
      <div style="flex: 1; display: grid; grid-template-columns: 1.6fr 1fr; gap: 10px;">
        <div style="background: #FFFFFF; border: 1.5px dashed #C9D6D3; border-radius: 10px; padding: 12px; display: flex; align-items: flex-end; gap: 8px;">
          <div style="flex: 1; height: 40%; background: color-mix(in srgb, #0E9384 65%, white); border-radius: 4px 4px 0 0;"></div>
          <div style="flex: 1; height: 55%; background: color-mix(in srgb, #0E9384 65%, white); border-radius: 4px 4px 0 0;"></div>
          <div style="flex: 1; height: 48%; background: color-mix(in srgb, #0E9384 65%, white); border-radius: 4px 4px 0 0;"></div>
          <div style="flex: 1; height: 72%; background: color-mix(in srgb, #0E9384 65%, white); border-radius: 4px 4px 0 0;"></div>
          <div style="flex: 1; height: 64%; background: #0E9384; border-radius: 4px 4px 0 0;"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="flex: 1; background: #FFFFFF; border: 1.5px dashed #C9D6D3; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 7px;">
            <div style="display: flex; gap: 6px; align-items: center;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #129D61;"></span><div style="flex: 1; height: 8px; background: #E3EAE8; border-radius: 4px;"></div></div>
            <div style="display: flex; gap: 6px; align-items: center;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #98A2B3;"></span><div style="flex: 1; height: 8px; background: #E3EAE8; border-radius: 4px;"></div></div>
            <div style="display: flex; gap: 6px; align-items: center;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #DE8F0D;"></span><div style="flex: 1; height: 8px; background: #E3EAE8; border-radius: 4px;"></div></div>
            <div style="display: flex; gap: 6px; align-items: center;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #E5484D;"></span><div style="flex: 1; height: 8px; background: #E3EAE8; border-radius: 4px;"></div></div>
          </div>
          <div style="height: 44px; background: color-mix(in srgb, #0E9384 8%, white); border: 1.5px dashed #0E9384; border-radius: 10px;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
