<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Aveon HR — Business Suite</title>
    <script>
      // Apply the saved appearance (theme, density, accent) before first paint
      // to avoid any flash of the defaults.
      try {
        var st = (JSON.parse(localStorage.getItem('aveon-theme') || '{}').state) || {};
        var el = document.documentElement;
        if (st.mode === 'light' || st.mode === 'dark') el.setAttribute('data-theme', st.mode);
        if (st.density === 'compact') el.setAttribute('data-density', 'compact');
        var A = { blue: ["#1D4ED8", "#1E40AF"], violet: ["#6D28D9", "#5B21B6"], teal: ["#0F766E", "#115E59"], rose: ["#BE123C", "#9F1239"], amber: ["#B45309", "#92400E"] };
        var a = A[st.accent];
        if (a) {
          var s = el.style, p = a[0];
          s.setProperty('--primary', p);
          s.setProperty('--primary-hover', a[1]);
          s.setProperty('--primary-ink', '#ffffff');
          s.setProperty('--primary-soft', 'color-mix(in srgb, ' + p + ' 13%, transparent)');
          s.setProperty('--sidebar-rail', p);
          s.setProperty('--sidebar-active', 'color-mix(in srgb, ' + p + ' 13%, transparent)');
          s.setProperty('--ring', '0 0 0 3px color-mix(in srgb, ' + p + ' 32%, transparent)');
          s.setProperty('--primary-border', 'color-mix(in srgb, ' + p + ' 45%, var(--surface))');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
